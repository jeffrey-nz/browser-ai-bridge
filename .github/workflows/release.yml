name: Release

# Publishes a GitHub release whose notes are that version's CHANGELOG.md section.
# Runs on a pushed v* tag, or by hand: for an existing tag it publishes (or
# refreshes) that tag's release; for a new tag it creates the tag at the commit
# the workflow was run on.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release, e.g. v2.0.0 (created at this commit if it doesn't exist)"
        required: true

permissions:
  contents: write

jobs:
  release:
    name: Create GitHub release
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # all tags, to find this one and tell whether it's the latest

      - name: Resolve tag
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          TAG="${INPUT_TAG:-$GITHUB_REF_NAME}"
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Tag must look like vX.Y.Z, got: $TAG" >&2
            exit 1
          fi
          echo "TAG=$TAG" >> "$GITHUB_ENV"
          if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            git checkout -q "refs/tags/$TAG"
            echo "NEW_TAG=false" >> "$GITHUB_ENV"
          else
            echo "NEW_TAG=true" >> "$GITHUB_ENV"
          fi

      - name: Extract release notes from CHANGELOG.md
        run: |
          VERSION="${TAG#v}"
          awk -v v="[$VERSION]" '
            index($0, "## " v) == 1 { found = 1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md > notes.md
          if ! grep -q '[^[:space:]]' notes.md; then
            echo "CHANGELOG.md has no section for $VERSION" >&2
            exit 1
          fi

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          NEWEST=$( (git tag -l 'v*'; echo "$TAG") | sort -V | tail -1)
          LATEST=$([ "$TAG" = "$NEWEST" ] && echo true || echo false)
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --title "$TAG" --notes-file notes.md --latest="$LATEST"
          elif [ "$NEW_TAG" = true ]; then
            gh release create "$TAG" --title "$TAG" --notes-file notes.md --target "$GITHUB_SHA" --latest="$LATEST"
          else
            gh release create "$TAG" --title "$TAG" --notes-file notes.md --verify-tag --latest="$LATEST"
          fi
