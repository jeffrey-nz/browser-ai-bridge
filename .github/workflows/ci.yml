name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    name: Lint & Unit Tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Check formatting
        run: npx prettier --check "src/**/*.js" "tests/**/*.js" "scripts/**"

      - name: Run unit tests
        run: npm test
        env:
          NODE_ENV: test

      - name: Check src/ module reachability (T-116)
        run: npm run check:reachable
